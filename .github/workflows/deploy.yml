name: Deploy Web App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          SECRET_APP_DIR: ${{ secrets.APP_DIR }}
          SECRET_REPO_URL: ${{ secrets.REPO_URL }}
          SECRET_DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
          SECRET_APP_PORT: ${{ secrets.APP_PORT }}
          SECRET_WEB_APIYI_KEY: ${{ secrets.WEB_APIYI_KEY }}
          SECRET_WEB_MEINIANDA_KEY: ${{ secrets.WEB_MEINIANDA_KEY }}
          SECRET_WEB_G_AISC_KEY: ${{ secrets.WEB_G_AISC_KEY }}
          SECRET_WEB_GPT_IMAGE25_KEY: ${{ secrets.WEB_GPT_IMAGE25_KEY }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: SECRET_APP_DIR,SECRET_REPO_URL,SECRET_DOMAIN_NAME,SECRET_APP_PORT,SECRET_WEB_APIYI_KEY,SECRET_WEB_MEINIANDA_KEY,SECRET_WEB_G_AISC_KEY,SECRET_WEB_GPT_IMAGE25_KEY
          script: |
            set -e
            export APP_DIR="${SECRET_APP_DIR:-/opt/ai-batchpic}"
            export REPO_URL="${SECRET_REPO_URL:-https://github.com/resign13/img.git}"
            export DOMAIN_NAME="${SECRET_DOMAIN_NAME:-design.smawell.shop}"
            export APP_PORT="${SECRET_APP_PORT:-10000}"
            export BRANCH="main"
            if [ ! -d "$APP_DIR/.git" ]; then
              mkdir -p "$(dirname "$APP_DIR")"
              git clone --branch "$BRANCH" "$REPO_URL" "$APP_DIR"
            else
              git -C "$APP_DIR" fetch origin "$BRANCH"
              git -C "$APP_DIR" checkout "$BRANCH"
              git -C "$APP_DIR" reset --hard "origin/$BRANCH"
            fi
            python3 "$APP_DIR/deploy/write_provider_env.py" "$APP_DIR/.env"
            bash "$APP_DIR/deploy/server_deploy.sh"
