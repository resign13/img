name: Deploy Web App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          SECRET_APP_DIR: ${{ secrets.APP_DIR }}
          SECRET_REPO_URL: ${{ secrets.REPO_URL }}
          SECRET_DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          envs: SECRET_APP_DIR,SECRET_REPO_URL,SECRET_DOMAIN_NAME
          script: |
            set -e
            export APP_DIR="${SECRET_APP_DIR:-/opt/ai-batchpic}"
            export REPO_URL="${SECRET_REPO_URL:-https://github.com/resign13/img.git}"
            export DOMAIN_NAME="${SECRET_DOMAIN_NAME:-}"
            export BRANCH="main"
            if [ ! -d "$APP_DIR/.git" ]; then
              mkdir -p "$(dirname "$APP_DIR")"
              git clone --branch "$BRANCH" "$REPO_URL" "$APP_DIR"
            fi
            bash "$APP_DIR/deploy/server_deploy.sh"
